#.
#Parameters and abilities of kinetic mechanisms
[kinetics]
	#.
	#.
	#Whether Deployers can perform sweep attacks.
	deployerSweepAttack = true

	#.
	#Parameters and abilities of recipe processing and fan-based bulk operations
	[kinetics.recipes]
		#.
		#.
		#Allow fans to process transmutation recipes when placed above transmutation catalysts.
		#Transmutation catalysts include: shimmer fluids.
		enableBulkTransmutation = true
		#.
		#Allow fans to process glooming recipes when placed above glooming catalyst blocks.
		#Glooming catalysts include: Twilight Forest's ominous fire block.
		enableBulkGlooming = true

	#.
	#Parameters for shimmer-based scepter repair functionality
	[kinetics.scepter_repair]
		#.
		#.
		#Enable shimmer fluid repairing for Twilight Forest scepters
		enableScepterRepair = true
		#.
		#Durability points restored per repair operation
		# Default: 9
		# Range: 1 ~ 100
		scepterRepairAmount = 9
		#.
		#Enable debug logging for scepter repair operations
		debugMode = false
		#.
		#Shimmer fluid cost per repair operation for Twilight Scepter (in mB)
		# Default: 500
		# Range: 1 ~ 1000
		twilightScepterRepairCost = 500
		#.
		#Shimmer fluid cost per repair operation for Lifedrain Scepter (in mB)
		# Default: 500
		# Range: 1 ~ 1000
		lifedrainScepterRepairCost = 500
		#.
		#Shimmer fluid cost per repair operation for Zombie Scepter (in mB)
		# Default: 50
		# Range: 1 ~ 1000
		zombieScepterRepairCost = 50
		#.
		#Shimmer fluid cost per repair operation for Fortification Scepter (in mB)
		# Default: 50
		# Range: 1 ~ 1000
		fortificationScepterRepairCost = 50
